    - CWL 1.0.2: conformance/1.0.2.md
    - CWL 1.1.0: conformance/1.1.0.md
    - CWL 1.2.0: conformance/1.2.0.md
    - CWL 1.2.1: conformance/1.2.1.md
- Explanation:
  - Overview: explanation/index.md
  - Background: explanation/background.md
