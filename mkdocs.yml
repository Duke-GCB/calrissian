site_name: Calrissian
site_description: 'CWL runner for Kubernetes'
# Repository

repo_name: 'Duke-GCB/calrissian'
repo_url: 'https://github.com/Duke-GCB/calrissian.git'
edit_uri: 'edit/develop/docs/'
site_url: 'https://Duke-GCB.github.io/calrissian/'


theme:
  name: material
  features:
  - content.code.copy

markdown_extensions:
- admonition
- pymdownx.highlight
- pymdownx.superfences
- attr_list

plugins:
- search
#- mkdocs-jupyter

nav:
- Home: index.md
- Tutorials:
  - Overview: tutorials/index.md
  - First CWL v1.2 tool: tutorials/first-tool.md
  - Parallel workflow: tutorials/parallel-workflow.md
- How-to guides:
  - Overview: how-to/index.md
  - Installation: installation.md
  - Upgrades: how-to/upgrades.md
  - Standalone deployment: how-to/deployment.md
  - Cluster configuration: cluster-configuration.md
  - Shared storage: how-to/storage.md
  - Submit and monitor: how-to/execution.md
  - Cancel and clean up: how-to/cleanup.md
  - Security and networking: how-to/security.md
  - Resources and GPUs: how-to/scheduling.md
  - Node placement: how-to/node-placement.md
  - Task labels: how-to/labels.md
  - Save tool logs: how-to/tool-logs.md
  - Configuration and environment: how-to/configuration.md
  - Results and provenance: how-to/reporting.md
  - Dask Gateway: how-to/dask.md
  - Authenticated Dask Gateway: how-to/dask-production.md
  - Validation and troubleshooting: how-to/validation.md
- Reference:
  - Overview: reference/index.md
  - CLI and configuration: reference/configuration.md
  - Compatibility: reference/compatibility.md
  - Usage-report JSON: reference/usage-report.md
  - Storage paths: reference/storage.md
  - Environment variables: reference/environment.md
  - CWL support: reference/cwl-support.md
  - Provenance: reference/provenance.md
  - Conformance evidence:
    - Badges: conformance/badges.md
