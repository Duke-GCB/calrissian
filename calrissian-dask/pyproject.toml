[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calrissian-dask"
version = "0.1.0"
description = "Optional Dask Gateway extension for Calrissian"
requires-python = ">=3.10"
dependencies = ["calrissian>=0.19.1"]

[project.entry-points."calrissian.extensions"]
dask-gateway = "calrissian_dask.plugin:create_extension"

[tool.hatch.build.targets.wheel]
packages = ["src/calrissian_dask"]
