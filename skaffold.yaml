apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: calrissian-conformance
build:
  local:
    push: false
  # The existing run-job scripts use conformance:latest.
  tagPolicy:
    customTemplate:
      template: latest
  artifacts:
  - image: calrissian
    context: .
    docker:
      dockerfile: Dockerfile
  - image: calrissian-dask
    context: .
    docker:
      dockerfile: Dockerfile.dask
    requires:
    - image: calrissian
      alias: CALRISSIAN_IMAGE
  - image: conformance
    context: .
    docker:
      dockerfile: conformance/Dockerfile.conformance
    requires:
    - image: calrissian
      alias: CALRISSIAN_IMAGE
deploy:
  kubeContext: calrissian-conformance
  helm:
    releases:
    - name: calrissian-conformance
      chartPath: conformance/chart
      namespace: calrissian-conformance
      createNamespace: true
      setValueTemplates:
        image: "{{.IMAGE_FULLY_QUALIFIED_conformance}}"

profiles:
- name: dask
  build:
    tagPolicy:
      envTemplate:
        template: '{{if eq .IMAGE_NAME "worker"}}{{if .DASK_WORKER_TAG}}{{.DASK_WORKER_TAG}}{{else}}dask-2024.1.0-gateway-client-2024.1.0-chart-2024.1.0{{end}}{{else}}latest{{end}}'
    artifacts:
    - image: calrissian
      context: .
      docker:
        dockerfile: Dockerfile
    - image: calrissian-dask
      context: .
      docker:
        dockerfile: Dockerfile.dask
      requires:
      - image: calrissian
        alias: CALRISSIAN_IMAGE
    - image: worker
      context: .
      docker:
        dockerfile: dask-gateway/Dockerfile.worker
        buildArgs:
          DASK_VERSION: "{{if .DASK_VERSION}}{{.DASK_VERSION}}{{else}}2024.1.0{{end}}"
          DASK_GATEWAY_VERSION: "{{if .DASK_GATEWAY_CLIENT_VERSION}}{{.DASK_GATEWAY_CLIENT_VERSION}}{{else}}2024.1.0{{end}}"
      requires:
      - image: calrissian-dask
        alias: CALRISSIAN_IMAGE
  deploy:
    helm:
      releases:
      - name: calrissian-conformance
        chartPath: conformance/chart
        namespace: calrissian-conformance
        createNamespace: true
        valuesFiles:
        - dask-gateway/session-values.yaml
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_worker}}"
      - name: dask-gateway
        remoteChart: dask-gateway
        repo: https://helm.dask.org
        version: "{{if .DASK_GATEWAY_CHART_VERSION}}{{.DASK_GATEWAY_CHART_VERSION}}{{else}}2024.1.0{{end}}"
        upgradeOnChange: true
        namespace: dask-gateway
        createNamespace: true
        valuesFiles:
        - dask-gateway/values.yaml
        setValueTemplates:
          gateway.backend.image.name: "{{.IMAGE_REPO_worker}}"
          gateway.backend.image.tag: "{{.IMAGE_TAG_worker}}"
          traefik.service.type: "ClusterIP"
