[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calrissian"
dynamic = ["version"]
description = 'CWL runner for Kubernetes'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Daniel Leehr"},
  { name = "John Bradley" },
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Emmanuel Mathot"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "urllib3>=2.8.0,<2.9",
  "kubernetes>=33.1.0,<37",
  "cwltool>=3.3.20260925135507,<3.4",
  "tenacity>=9.2.1,<10",
  "msgpack>=1.2.1,<1.3",
  "typing-extensions>=4.16.0,<5",
  "freezegun>=1.5.1,<1.6",
  "shellescape>=3.8.1,<3.9",
  "python-dateutil>=2.9.0.post0,<4"
]

[project.urls]
Documentation = "https://github.com/Duke-GCB/calrissian#readme"
Issues = "https://github.com/Duke-GCB/calrissian/issues"
Source = "https://github.com/Duke-GCB/calrissian"

[tool.hatch.version]
path = "calrissian/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:calrissian tests}"

[tool.coverage.run]
source_pkgs = ["calrissian", "tests"]
branch = true
parallel = true
omit = [
  "calrissian/__about__.py",
]

[tool.coverage.paths]
calrissian = ["calrissian"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.hatch.envs.default]
skip-install = false
dependencies = [
  "urllib3>=2.8.0,<2.9",
  "kubernetes>=33.1.0,<37",
  "cwltool>=3.3.20260925135507,<3.4",
  "tenacity>=9.2.1,<10",
  "msgpack>=1.2.1,<1.3",
  "typing-extensions>=4.16.0,<5",
  "freezegun>=1.5.1,<1.6",
  "shellescape>=3.8.1,<3.9",
  "python-dateutil>=2.9.0.post0,<4"
]

[tool.hatch.envs.prod]
path = "/app/envs/calrissian"

[tool.hatch.metadata]
allow-direct-references = true


[project.scripts]
calrissian = "calrissian.main:main"

[tool.hatch.envs.test]
skip-install = false

dependencies = [
  "pytest",
  "coverage",
  "urllib3>=2.8.0,<2.9",
  "kubernetes>=33.1.0,<37",
  "cwltool>=3.3.20260925135507,<3.4",
  "tenacity>=9.2.1,<10",
  "msgpack>=1.2.1,<1.3",
  "typing-extensions>=4.16.0,<5",
  "freezegun>=1.5.1,<1.6",
  "shellescape>=3.8.1,<3.9",
  "python-dateutil>=2.9.0.post0,<4",
  "coverage[toml]"
]

[tool.hatch.envs.test.env-vars]
RETRY_ATTEMPTS="0"

[tool.hatch.envs.test.scripts]
test = "hatch run pytest"
testv = "hatch run pytest --verbose"
testdask = "hatch run pytest tests/test_dask.py"
cov = ["coverage run --source=calrissian -m pytest", "coverage report"]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
skip-install = false

dependencies = [
  "pdocs",
  "mkdocs-material",
  "mkdocs-jupyter"
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"
