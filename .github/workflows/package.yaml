name: build-publish

env:
  VIRTUALENV_PIP: '26.2.2'

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: read
      id-token: write
     
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        sh scripts/bootstrap-pip.sh
        python -m pip install "certifi>=2026.10.19" "uv>=0.13.4" hatch
    - name: Build package
      run: hatch build
    - name: Test package
      run: hatch run test.py3.12:testv
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
      with:
        skip-existing: true
        repository-url: https://upload.pypi.org/legacy/
  
# Container builds and GHCR publishing are handled by publish-images.yaml.

