name: build-publish

env:
  VIRTUALENV_PIP: '26.2.2'

on:
  release:
    types: [created]

permissions:
  id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
  contents: read
  packages: write
  attestations: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment: release
     
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        sh scripts/bootstrap-pip.sh
        python -m pip install "certifi>=2026.10.19" "uv>=0.13.4" hatch
    - name: Build package
      run: hatch build
    - name: Test package
      run: hatch run test.py3.12:testv
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        repository-url: https://upload.pypi.org/legacy/
  
  container-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4   
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image
      run: |
        version=$( cat calrissian/__about__.py | cut -d "=" -f 2 | tr -d '"' )
        IMAGE_ID=ghcr.io/duke-gcb/calrissian/calrissian
        docker build --pull --no-cache . --file Dockerfile --tag calrissian
        docker tag calrissian $IMAGE_ID:$version
        docker push $IMAGE_ID:$version

