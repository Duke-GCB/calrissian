name: docs
on:
  push:
    branches:
    - master
    - main
    paths:
    # Only rebuild website when docs have changed
    - 'README.md'
    - 'docs/**'
    - 'mkdocs.yml'
    - 'Taskfile.yaml'
    - 'scripts/fix-api-doc-links.py'
    - 'scripts/generate-cli-reference.py'
    - 'pyproject.toml'
    - 'calrissian/**'
    - 'calrissian-dask/**'
    - 'calrissian-dask/pyproject.toml'
    - '.github/workflows/docs.yaml'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: sh scripts/bootstrap-pip.sh
    - uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2.0.0
    - run: python -m pip install "certifi>=2026.10.19" "uv>=0.13.4" mkdocs-material mkdocs-mermaid2-plugin mkdocs-jupyter
    - run: task docs:generate
    - run: mkdocs gh-deploy --force
