name: docs
on:
  push:
    branches:
    - master
    - main
    paths:
    # Only rebuild website when docs have changed
    - 'README.md'
    - 'docs/**'
    - 'mkdocs.yml'
    - 'Taskfile.yaml'
    - 'scripts/fix-api-doc-links.py'
    - 'scripts/generate-cli-reference.py'
    - 'pyproject.toml'
    - 'calrissian/**'
    - '.github/workflows/docs.yaml'
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: sh scripts/bootstrap-pip.sh
    - uses: arduino/setup-task@v2
    - run: python -m pip install "certifi>=2026.10.19" "uv>=0.13.4" mkdocs-material mkdocs-mermaid2-plugin mkdocs-jupyter
    - run: task docs:generate
    - run: mkdocs gh-deploy --force
